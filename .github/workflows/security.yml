# Dependency vulnerability scan.
#
# Relocated to the repository root: GitHub Actions only discovers workflows in
# <repo-root>/.github/workflows/, and this file previously sat in macro_research_platform/,
# so it never ran. Paths are relative to the repo root, hence the working-directory default.
#
# The `test` job this file used to carry ran `cd api && pytest tests/`, which aborts during
# collection: api/tests/conftest.py asserts that api/ itself is not on sys.path. Testing now
# lives in ci.yml, which runs the documented make targets from the project root.

name: Security Audit

on:
  push:
  pull_request:
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'

defaults:
  run:
    working-directory: macro_research_platform

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: macro_research_platform/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc
