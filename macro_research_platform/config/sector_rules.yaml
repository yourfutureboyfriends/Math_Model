# =============================================================================
# Sector Allocation Rules - Config Driven
#
# CHANGE SUMMARY
# =============================================================================
# FIXED: "Inflation Pressure / Late-Cycle", "Recovery / Mixed", and
#        "Mixed / Transition" regime entries previously used YAML anchors
#        (&id001 / *id001 etc.) that mapped ALL sectors to the same block with
#        score: 0.0.  This caused every sector to receive a zero regime_fit
#        score for those regimes, making all signals Neutral/PLACEHOLDER.
#        Replaced with sector-specific scores reflecting real macro logic.
# FIXED: signal_thresholds overweight/underweight were 0.4 / -0.4.  Given
#        that all components are multiplied by their weights (regime_fit at
#        0.30, etc.) the maximum possible regime_fit contribution is ~0.24.
#        Reaching ±0.4 total required near-perfect alignment across all
#        factors, producing Neutral for nearly every sector in practice.
#        Lowered to ±0.15 so meaningful signals emerge under realistic scores.
# =============================================================================

sectors:
