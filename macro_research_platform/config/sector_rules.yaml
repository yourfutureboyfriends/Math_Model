scoring_formula: "sector_score =\n  (regime_fit * 0.30) +\n  (financial_conditions_fit\
  \ * 0.20) +\n  (earnings_sensitivity_to_growth * 0.15) +\n  (rate_sensitivity_score\
  \ * 0.10) +\n  (credit_sensitivity_score * 0.10) +\n  (momentum_confirmation * 0.10)\
  \ +\n  (valuation_support * 0.05) -\n  (recession_risk_penalty)\n"

scoring_components:
  regime_fit:
    weight: 0.30
    description: How well does this sector perform in the current macro regime
  financial_conditions_fit:
    weight: 0.20
    description: Alignment with financial conditions (easing/tightening)
  earnings_sensitivity:
    weight: 0.15
    description: Cyclical earnings beta to growth score
  rate_sensitivity:
    weight: 0.10
    description: Sensitivity to interest rate levels
  credit_sensitivity:
    weight: 0.10
    description: Sensitivity to credit market conditions
  momentum_confirmation:
    weight: 0.10
    description: Price/earnings momentum confirmation
  valuation_support:
    weight: 0.05
    description: Relative valuation support

# FIXED: Lowered from ±0.40 to ±0.15.
# Rationale: the maximum regime_fit contribution is regime_score * 0.30.
# For the highest-scoring sector/regime pair (0.8 * 0.30 = 0.24), reaching
# the old ±0.40 threshold required near-perfect multi-factor alignment.
# Under typical live-data conditions (growth ~0.0–0.2) most sectors scored
# Neutral regardless of regime.  ±0.15 produces well-calibrated signals.
signal_thresholds:
  overweight: 0.15
  neutral_min: -0.15
  neutral_max: 0.15
  underweight: -0.15

constraints:
  max_sector_weight: 0.25
  min_sector_weight: 0.05
  max_deviation_from_benchmark: 0.1
