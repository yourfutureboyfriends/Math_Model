<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terminal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macro Terminal</title>

    <!-- Geist Fonts from Vercel -->
    <link rel="preconnect" href="https://vercel.com">
    <link rel="preconnect" href="https://assets.vercel.com">

    <!-- Google Fonts fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Inline Geist font faces (primary) -->
    <style>
      /* Google Fonts as primary - Geist CDN is unreliable */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

      /* Font fallbacks */
      :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
      }
    </style>

    <!-- Price Flash Animations -->
    <style>
      @keyframes flashUp {
        0% { background-color: rgba(34, 197, 94, 0.4); }
        100% { background-color: transparent; }
      }
      @keyframes flashDown {
        0% { background-color: rgba(239, 68, 68, 0.4); }
        100% { background-color: transparent; }
      }
      .flash-up { animation: flashUp 0.5s ease-out; }
      .flash-down { animation: flashDown 0.5s ease-out; }

      /* Connection Status Dot */
      #ws-status {
        position: fixed;
        top: 1rem;
        right: 1rem;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ef4444;
        transition: background-color 0.3s;
        z-index: 9999;
      }
      #ws-status.connected { background-color: #22c55e; }
      #ws-status.connecting { background-color: #f59e0b; }

      /* Regime Change Modal */
      #regime-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 10000;
        align-items: center;
        justify-content: center;
      }
      #regime-modal.active { display: flex; }
      #regime-modal .modal-content {
        background: #18181b;
        border: 1px solid #3f3f46;
        padding: 2rem;
        max-width: 500px;
        text-align: center;
      }
      #regime-modal .regime-badge {
        display: inline-block;
        padding: 0.5rem 1rem;
        margin: 1rem 0;
        font-family: 'Geist Mono', monospace;
        font-size: 1.25rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="bg-bg text-text-primary font-sans antialiased">
    <div id="ws-status" title="WebSocket Status"></div>

    <div id="regime-modal">
      <div class="modal-content">
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Regime Change Detected</h2>
        <p style="color: #a1a1aa; margin-bottom: 1rem;">Market regime has shifted</p>
        <div id="regime-badge" class="regime-badge"></div>
        <p id="regime-description" style="color: #71717a; font-size: 0.875rem; margin-bottom: 1.5rem;"></p>
        <button onclick="closeRegimeModal()" style="padding: 0.5rem 1.5rem; background: #3b82f6; color: white; border: none; cursor: pointer; font-family: inherit;">Acknowledge</button>
      </div>
    </div>

    <div id="root"></div>

    <!-- Socket.IO handled by React useMarketStream hook - inline client removed to prevent duplicates -->

    <!-- Service Worker Registration -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(registration => {
                console.log('[SW] Service worker registered:', registration.scope);
              })
              .catch(error => {
                console.error('[SW] Service worker registration failed:', error);
              });
          });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
