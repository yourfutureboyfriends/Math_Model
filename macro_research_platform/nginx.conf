# ═══════════════════════════════════════════════════════════════════════════════
# Macro Research Platform — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ═════════════════════════════════════════════════════════════════════════════
    # Frontend — React SPA
    # ═════════════════════════════════════════════════════════════════════════════

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML files should not be cached
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store";
        }
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # Backend API Proxy
    # ═════════════════════════════════════════════════════════════════════════════

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running calculations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # WebSocket Proxy (SocketIO)
    # ═════════════════════════════════════════════════════════════════════════════

    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout for persistent WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # Report Archive (optional direct access)
    # ═════════════════════════════════════════════════════════════════════════════

    location /reports/ {
        alias /app/reports/;
        autoindex on;
        autoindex_format html;

        # Only allow internal access or add auth
        allow all;

        # Cache reports for 1 hour
        expires 1h;
        add_header Cache-Control "public";
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # Health Check Endpoint (for load balancers)
    # ═════════════════════════════════════════════════════════════════════════════

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # Maintenance Page
    # ═════════════════════════════════════════════════════════════════════════════

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ═════════════════════════════════════════════════════════════════════════════
    # Security Headers (Institutional Requirements)
    # ═════════════════════════════════════════════════════════════════════════════

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (adjust based on actual needs)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.socket.io https://assets.vercel.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.vercel.com; font-src 'self' https://fonts.gstatic.com https://assets.vercel.com; connect-src 'self' ws: wss: http: https:; img-src 'self' data:;" always;

    # Hide server version
    server_tokens off;

    # ═════════════════════════════════════════════════════════════════════════════
    # Rate Limiting (optional - requires nginx-plus or module)
    # ═════════════════════════════════════════════════════════════════════════════

    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=api burst=20 nodelay;
    #     ...
    # }

    # ═════════════════════════════════════════════════════════════════════════════
    # Gzip Compression
    # ═════════════════════════════════════════════════════════════════════════════

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ═════════════════════════════════════════════════════════════════════════════
    # Logging
    # ═════════════════════════════════════════════════════════════════════════════

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
