# ═══════════════════════════════════════════════════════════════════════════════
# Macro Terminal v8.0 — Production Infrastructure (Phases 9-13)
# PostgreSQL/TimescaleDB + Redis + Celery + FastAPI + React
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.9'

services:
  # ═════════════════════════════════════════════════════════════════════════════
  # PostgreSQL with TimescaleDB extension for time-series data
  # ═════════════════════════════════════════════════════════════════════════════
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: macro-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-macro_terminal_secure_2024}
      POSTGRES_DB: macro_terminal
      TZ: America/New_York
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - macro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ═════════════════════════════════════════════════════════════════════════════
  # Redis for Celery broker, caching, and WebSocket pub/sub
  # ═════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: macro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - macro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════════════
  # FastAPI Backend (ASGI + Uvicorn)
  # ═════════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: macro-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://macro:${DB_PASSWORD:-macro_terminal_secure_2024}@timescaledb:5432/macro_terminal
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-change-this-in-production}
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - ./api:/app
      - api_logs:/app/logs
      - api_data:/app/data
    networks:
      - macro-network
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # ═════════════════════════════════════════════════════════════════════════════
  # Celery Worker for background tasks
  # ═════════════════════════════════════════════════════════════════════════════
  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: macro-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q pipeline,signals,reports,default
    environment:
      - DATABASE_URL=postgresql+asyncpg://macro:${DB_PASSWORD:-macro_terminal_secure_2024}@timescaledb:5432/macro_terminal
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-change-this-in-production}
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - ./api:/app
      - celery_logs:/app/logs
      - api_data:/app/data
    networks:
      - macro-network
    depends_on:
      - redis
      - timescaledb
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ═════════════════════════════════════════════════════════════════════════════
  # Celery Beat for scheduled tasks
  # ═════════════════════════════════════════════════════════════════════════════
  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: macro-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://macro:${DB_PASSWORD:-macro_terminal_secure_2024}@timescaledb:5432/macro_terminal
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production-change-this-in-production}
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./api:/app
      - celery_logs:/app/logs
    networks:
      - macro-network
    depends_on:
      - redis
      - timescaledb

  # ═════════════════════════════════════════════════════════════════════════════
  # Flower - Celery monitoring dashboard
  # ═════════════════════════════════════════════════════════════════════════════
  flower:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: macro-flower
    restart: unless-stopped
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - macro-network
    depends_on:
      - redis
      - celery-worker

  # ═════════════════════════════════════════════════════════════════════════════
  # Ollama LLM Service (optional - for news sentiment analysis)
  # ═════════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: macro-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - macro-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    profiles: ["llm"]  # Only start with --profile llm

  # ═════════════════════════════════════════════════════════════════════════════
  # Frontend (React + Vite)
  # ═════════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: macro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - macro-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════════════════════════════════════
  # Investor Portal Frontend (separate light-themed React app)
  # ═════════════════════════════════════════════════════════════════════════════
  investor-portal:
    build:
      context: ./investor-portal
      dockerfile: Dockerfile
    container_name: macro-investor-portal
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - macro-network
    depends_on:
      - api
    profiles: ["investor"]  # Only start with --profile investor

# ═══════════════════════════════════════════════════════════════════════════════
# Persistent Volumes
# ═══════════════════════════════════════════════════════════════════════════════

volumes:
  timescale_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  api_data:
    driver: local
  celery_logs:
    driver: local
  ollama_data:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  macro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
